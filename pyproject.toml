[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsedge"
version = "0.1.0"
description = "Stats-driven sports betting edge finder: moneylines, spreads, totals and player props"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sportsedge = "sportsedge.cli:main"

[tool.setuptools.packages.find]
include = ["sportsedge*"]
