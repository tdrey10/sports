name: Keeper

# Owner, Nov 9 ("build it"): GitHub's scheduler skipped most SportsEdge runs (about 10 of 70 on Nov 8-9, gaps of
# 3-5 hours), so the board went stale. The keeper starts the engine itself: every 30 minutes it checks when
# SportsEdge last ran and starts it if it has been 25+ minutes. A keeper run lasts about 5.5 hours, then starts the
# next keeper. The 6-hour schedule below only restarts the chain if a hand-off ever gets lost.
# Free: the repo is public, so Actions minutes cost nothing. It never touches the Odds API.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start SportsEdge every 30 minutes
        run: |
          end=$(( $(date +%s) + 300 * 60 ))
          daily=""
          while [ "$(date +%s)" -lt "$end" ]; do
            # The daily studies and the morning prop pricing ride on the 8:47 AM PT schedule, which GitHub
            # skips too: the keeper check between 15:30 and 15:59 UTC starts them (the checks are 30 minutes apart, so one does).
            if [ -z "$daily" ] && [ "$(date -u +%H%M)" -ge 1530 ] && [ "$(date -u +%H%M)" -le 1559 ]; then
              gh workflow run sportsedge.yml -f study=true -f props=true && echo "$(date -u +%H:%M) started the daily studies"
              daily=1
              sleep 1800
              continue
            fi
            last=$(gh run list --workflow sportsedge.yml --limit 1 --json createdAt --jq '.[0].createdAt' || true)
            age=999999
            if [ -n "$last" ]; then age=$(( $(date +%s) - $(date -d "$last" +%s) )); fi
            if [ "$age" -ge 1500 ]; then
              gh workflow run sportsedge.yml -f study=false && echo "$(date -u +%H:%M) started SportsEdge (last run ${age}s ago)"
            else
              echo "$(date -u +%H:%M) SportsEdge ran ${age}s ago, skipping"
            fi
            sleep 1800
          done

      - name: Hand off to the next keeper
        if: always()
        run: gh workflow run keeper.yml
