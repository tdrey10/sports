name: Probe CFB injuries (temporary)
on:
  push:
    branches: ["probe/cfb-injuries"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python probe/cfb_inj.py
