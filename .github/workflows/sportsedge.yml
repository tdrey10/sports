name: SportsEdge

# Everything runs on free ESPN data (stats plus DraftKings lines). No API key or paid plan needed.
# GitHub's free plan gives private repos 2,000 Actions minutes a month. Each refresh takes about a
# minute (26 a day) and the daily study up to 21, about 1,400 minutes a month in all.
on:
  schedule:
    # Each refresh: live-bet check, fresh odds and injuries, new picks, line tracking, scores, grading.
    # Every 30 minutes from 8 AM to 8 PM Pacific, when lines move and games start.
    - cron: "15,45 0-2,15-23 * * *"
    # Hourly early morning and late evening. The 13:15 UTC run posts the Lock and Dog by 8 AM Pacific.
    - cron: "15 3-6,11-14 * * *"
    - cron: "47 15 * * *"      # daily studies + NFL and NBA player props (8:47 AM Pacific)
  workflow_dispatch:
    inputs:
      props:
        description: "Also price NFL + NBA player props for games in the next 30 hours"
        type: boolean
        default: false
      study:
        description: "Run the studies first (replay past games at their closing odds)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write # live bets are also posted to the "The Great Hambino live bets" issue

# Publishing to GitHub Pages is OFF unless you set the repository variable
# PUBLISH_PAGES=true. Leave it off if this GitHub account hosts any other site
# (for example a business site with a custom domain): project pages inherit
# that domain. Without Pages, open the dashboard from the uploaded artifact or
# run `hambino serve` locally.

concurrency:
  group: sportsedge
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache ESPN downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/sportsedge
          key: espn-${{ github.run_id }}
          restore-keys: espn-

      - run: pip install -e .

      - name: Live bets, scores and grading
        if: github.event_name == 'schedule' && github.event.schedule != '47 15 * * *'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: hambino live nfl,nba,mlb,nhl,soccer --once --notify

      # Once a day (and on hand-started runs): replay the last two seasons of finished games
      # against their real closing odds, learn the market weight, edge threshold and
      # calibration per sport, and save each game's closing line so it is downloaded once.
      - name: Studies
        if: github.event.schedule == '47 15 * * *' || (github.event_name == 'workflow_dispatch' && inputs.study)
        run: hambino study nfl,ncaaf,nba,ncaab,mlb,nhl,soccer --budget 12000 --minutes 20
        timeout-minutes: 30

      - name: Full engine cycle
        env:
          # NFL + NBA props, most popular markets, games in the next 30 hours, once a day
          # (or when run by hand with props ticked).
          PROPS_ARGS: >-
            ${{ (inputs.props || github.event.schedule == '47 15 * * *') && '--props --props-sports nfl,nba --props-hours 30
            --prop-markets player_pass_yds,player_rush_yds,player_reception_yds,player_receptions,player_points,player_rebounds,player_assists,player_threes,player_points_rebounds_assists' || '' }}
        run: sportsedge run nfl,nba,mlb,nhl,soccer $PROPS_ARGS

      - name: Save the ledger
        run: |
          git config user.name "sportsedge-bot"
          git config user.email "sportsedge-bot@users.noreply.github.com"
          git add data/ledger.json data/brain.json
          # One path at a time: git add fails as a whole if any path is missing.
          for p in data/studies.json data/history data/games data/odds data/props data/props_graded; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          git diff --cached --quiet || git commit -m "Update pick ledger"
          git pull --rebase --autostash && git push

      # The Home Screen site on Cloudflare Pages (free): the duck as the app icon, "Hambino" as
      # its name. Runs once the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set.
      - name: Cache the Cloudflare deploy tool
        if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-wrangler-3.114.0

      - name: Publish the Home Screen site
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          funky page --out "$RUNNER_TEMP/page.html" --app-dir "$RUNNER_TEMP/hambino"
          npx --yes wrangler@3.114.0 pages project create hambino --production-branch=main || true
          npx --yes wrangler@3.114.0 pages deploy "$RUNNER_TEMP/hambino" --project-name=hambino --branch=main --commit-dirty=true

      - name: Keep the dashboard as a private download
        uses: actions/upload-artifact@v4
        with:
          name: great-hambino-dashboard
          path: site
          retention-days: 7

      - name: Package for GitHub Pages
        if: vars.PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: run
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
