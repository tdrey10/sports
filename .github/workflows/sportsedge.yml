name: SportsEdge

# Everything runs on free ESPN data (stats plus DraftKings lines). No API key or paid plan needed.
# GitHub's free plan gives private repos 2,000 Actions minutes a month. Each refresh takes about a
# minute (about 30 a day) and the daily study up to 21, about 1,400 minutes a month in all.
on:
  schedule:
    # Each refresh: live-bet check, fresh odds and injuries, new picks, line tracking, scores, grading.
    # Every 30 minutes from 6 AM to 8 PM Pacific (5 AM in winter), when lines move and games start.
    # Owner, Oct 25: the board is up by 7 AM, so the 6:15 and 6:45 runs post the day's picks.
    - cron: "15,45 0-2,13-23 * * *"
    # Hourly the rest of the night: the engine watches lines and injury news, posting any edge it finds.
    - cron: "15 3-12 * * *"
    - cron: "47 15 * * *"      # daily studies + NFL and NBA player props (8:47 AM Pacific)
  workflow_dispatch:
    inputs:
      props:
        description: "Also price NFL + NBA player props for games in the next 30 hours"
        type: boolean
        default: false
      study:
        description: "Run the studies first (replay past games at their closing odds)"
        type: boolean
        default: true
      sharp:
        description: "Check sharp value (Pinnacle vs US books) now"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write # live bets are also posted to the "The Great Hambino live bets" issue

# Publishing to GitHub Pages is OFF unless you set the repository variable
# PUBLISH_PAGES=true. Leave it off if this GitHub account hosts any other site
# (for example a business site with a custom domain): project pages inherit
# that domain. Without Pages, open the dashboard from the uploaded artifact or
# run `hambino serve` locally.

concurrency:
  group: sportsedge
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      # Always start from the newest main (a queued run would otherwise use the ledger from
      # when it was queued, and clash with the run that finished before it).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache ESPN downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/sportsedge
          key: espn-${{ github.run_id }}
          restore-keys: espn-

      - run: pip install -e .

      - name: Live bets, scores and grading
        if: github.event_name == 'schedule' && github.event.schedule != '47 15 * * *'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: hambino live nfl,ncaaf,nba,mlb,nhl,soccer --once --notify

      # Once a day (and on hand-started runs): replay the last two seasons of finished games
      # against their real closing odds, learn the market weight, edge threshold and
      # calibration per sport, and save each game's closing line so it is downloaded once.
      - name: Studies
        if: github.event.schedule == '47 15 * * *' || (github.event_name == 'workflow_dispatch' && inputs.study)
        run: hambino study nfl,ncaaf,nba,ncaab,mlb,nhl,soccer --budget 12000 --minutes 15 --box-minutes 8
        timeout-minutes: 35

      # NFL blind test on every season of closing lines since 2006 (nflverse, free).
      - name: NFL history test
        if: github.event.schedule == '47 15 * * *' || (github.event_name == 'workflow_dispatch' && inputs.study)
        continue-on-error: true
        run: hambino nfl-history --fetch

      # College football blind test on 2006-2022 lines (saved in data/lines/ncaaf).
      - name: College football history test
        if: github.event.schedule == '47 15 * * *' || (github.event_name == 'workflow_dispatch' && inputs.study)
        continue-on-error: true
        run: hambino ncaaf-history

      # NBA, NHL, MLB and college basketball blind tests, plus 15 dog/value/totals studies in six
      # sports, on 2018+ closing lines
      # (public ESPN archive, refreshed each run; saved in data/lines/<sport>).
      - name: NBA/NHL/MLB/college hoops history test
        if: github.event.schedule == '47 15 * * *' || (github.event_name == 'workflow_dispatch' && inputs.study)
        continue-on-error: true
        run: hambino espn-history --fetch

      # Prediction study: how far each sport's predictions move the Vegas line toward our ratings
      # (2018+ games, tuned through 2021, blind after).
      - name: Prediction study
        if: github.event.schedule == '47 15 * * *' || (github.event_name == 'workflow_dispatch' && inputs.study)
        continue-on-error: true
        run: hambino forecast-study

      # The D503 engine (the owner's call, Oct 24): refit Elo, the own-read model and the market
      # blend per sport every morning; the board reads data/d5_models.json each run.
      - name: D503 refit
        if: github.event.schedule == '47 15 * * *' || (github.event_name == 'workflow_dispatch' && inputs.study)
        continue-on-error: true
        run: hambino d5-fit

      # Soccer spots: form, streaks, head to head, scoring style, draws and rest, on the
      # engine's own 2024+ results and 2025+ closing prices (seven leagues).
      - name: Soccer study
        if: github.event.schedule == '47 15 * * *' || (github.event_name == 'workflow_dispatch' && inputs.study)
        continue-on-error: true
        run: hambino soccer-study

      # Price shopping: the best of 10-25 books vs the others' consensus, NFL and college football
      # moneylines since 2020 (public archive), tuned through 2022, blind after.
      - name: Price-shopping study
        if: github.event.schedule == '47 15 * * *' || (github.event_name == 'workflow_dispatch' && inputs.study)
        continue-on-error: true
        run: hambino shop-study --fetch

      # Tennis blind test on 2012+ ATP/WTA closing odds (public archive), with the other studies.
      - name: Tennis history test
        if: github.event.schedule == '47 15 * * *' || (github.event_name == 'workflow_dispatch' && inputs.study)
        continue-on-error: true
        run: hambino tennis-history --fetch

      - name: Full engine cycle
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}  # optional: sharp value (Pinnacle vs US books)
          # NFL + NBA props, most popular markets, games in the next 30 hours, once a day
          # (or when run by hand with props ticked).
          PROPS_ARGS: >-
            ${{ (inputs.props || github.event.schedule == '47 15 * * *') && '--props --props-sports nfl,nba --props-hours 30
            --prop-markets player_pass_yds,player_rush_yds,player_reception_yds,player_receptions,player_points,player_rebounds,player_assists,player_threes,player_points_rebounds_assists' || '' }}
        run: sportsedge run nfl,ncaaf,nba,mlb,nhl,soccer $PROPS_ARGS ${{ inputs.sharp && '--sharp-now' || '' }}

      # UFC research: fights, DraftKings lines (ESPN drops them after each fight, so they are saved
      # here), fighter ratings. No UFC bets are posted until the blind test is passed.
      # Tennis: a prediction for every ATP/WTA match with a line, graded on the results.
      - name: Tennis predictions
        continue-on-error: true
        run: hambino tennis

      - name: UFC lines and ratings
        continue-on-error: true
        run: hambino ufc

      - name: Save the ledger
        run: |
          git config user.name "sportsedge-bot"
          git config user.email "sportsedge-bot@users.noreply.github.com"
          git add data/ledger.json data/brain.json
          # One path at a time: git add fails as a whole if any path is missing.
          for p in data/studies.json data/ufc.json data/nfl_history.json data/ncaaf_history.json data/espn_history.json data/line_studies.json data/tennis_history.json data/forecast_study.json data/d5_models.json data/qb data/shop_study.json data/soccer_study.json data/study_log.json data/lines data/boxscores data/history data/games data/odds data/props data/props_graded; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          git diff --cached --quiet || git commit -m "Update pick ledger"
          # If another run saved in the meantime, this run's data wins any clash (it is newer).
          # Retry: main can move while we push (another run, or a merged change).
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs && git push && exit 0
            echo "save attempt $i failed; retrying"; git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          exit 1

      # The Home Screen site on Cloudflare Pages (free): the duck as the app icon, "Hambino" as
      # its name. Runs once the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set.
      - name: Cache the Cloudflare deploy tool
        if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-wrangler-3.114.0

      - name: Publish the Home Screen site
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          funky page --out "$RUNNER_TEMP/page.html" --app-dir "$RUNNER_TEMP/hambino"
          # The project already exists after the first run; that "error" is expected, so it is silenced.
          npx --yes wrangler@3.114.0 pages project create hambino --production-branch=main >/dev/null 2>&1 || true
          npx --yes wrangler@3.114.0 pages deploy "$RUNNER_TEMP/hambino" --project-name=hambino --branch=main --commit-dirty=true

      - name: Keep the dashboard as a private download
        uses: actions/upload-artifact@v4
        with:
          name: great-hambino-dashboard
          path: site
          retention-days: 7

      - name: Package for GitHub Pages
        if: vars.PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: run
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
