<title>Follow Me, Instead Of Your Dreams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: the photo is the cover. A scoreboard-sized title, then today's #1 pick as a betting ticket,
   then a ranked Top 10 with an edge meter on every pick, then the board by game. Straight bets only. */
:root {
  /* Trail Blazers night: black, Blazers red, silver. One committed dark look. */
  --bg: #0b0b0c; --surface: #161618; --surface-2: #1f1f22; --line: #2b2b30; --line-2: #3b3b41;
  --fg: #f4f4f5; --muted: #a3a9ac; --silver: #c4cacd; --accent: #e03a3e; --accent-2: #ff5a5e; --accent-soft: #3a1618;
  --win: #e9ecee; --win-soft: #2a2c2f; --loss: #ff6b6e; --loss-soft: #3a1a1c;
  --live: #e03a3e; --live-soft: #3a1618; --info: #c4cacd; --info-soft: #26272b;
  --ticket: #f2f0ec; --ticket-ink: #121214; --ticket-muted: #5d5f63;
  --tint: 11, 11, 12;
  --display: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: transparent; color: var(--fg); font: 16px/1.45 var(--body); }
/* The Great Hambino photo sits behind the whole engine, tinted black so the picks stay readable,
   and fades into the black page below it (the photo is 3:4, hence the 4 / 3 height).
   A fixed layer (not background-attachment) so it also stays put on phones. */
.photo-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, rgba(var(--tint), .45) 0%, rgba(var(--tint), .3) 28%, rgba(var(--tint), .62) 52%, rgba(var(--tint), .9) 78%, rgba(var(--tint), .96) 100%),
    linear-gradient(180deg, transparent 70%, var(--bg)) 50% 0% / max(100vw, 520px) calc(max(100vw, 520px) * 4 / 3) no-repeat,
    var(--mascot) 50% 0% / max(100vw, 520px) auto no-repeat, var(--bg); }
/* Wide screens (and the gallery thumbnail): frame the portrait by height, centered on the face. */
/* Wide screens (and the gallery thumbnail): the Hambino duck in his smoking jacket stands to
   the right of the title, on his red damask wall, fading into the black page. Phones keep the photo. */
@media (min-width: 761px) {
  .photo-bg { --ph: max(100vh, 680px); --pw: calc(var(--ph) * 0.7); --px: calc(50% + min(24vw, 300px));
    background: linear-gradient(180deg, rgba(var(--tint), .05) 0%, rgba(var(--tint), .1) 40%, rgba(var(--tint), .7) 70%, rgba(var(--tint), .95) 90%),
      linear-gradient(90deg, var(--bg), transparent 22%, transparent 85%, var(--bg)) var(--px) 0 / var(--pw) var(--ph) no-repeat,
      linear-gradient(180deg, transparent 55%, var(--bg)) var(--px) 0 / var(--pw) var(--ph) no-repeat,
      var(--thumb) var(--px) 0 / var(--pw) var(--ph) no-repeat, var(--bg); }
  /* The cover is just the name and the duck (it is the gallery thumbnail); the day's picks start below it. */
  #hero { display: none; }
  main .mast { min-height: clamp(460px, 82vh, 760px); padding-bottom: 6vh; }
}

.wrap { max-width: 820px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 64px; display: grid;
  grid-template-columns: minmax(0, 1fr); gap: 18px; }
.wrap > *, .panel > *, .grid > * { min-width: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.pos { color: var(--win) !important; } .neg { color: var(--loss) !important; }

/* ---------- cover ---------- */
.mast { min-height: clamp(230px, 40vh, 430px); display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; }
.eyebrow { margin: 0; font: 700 13px/1.4 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--silver);
  text-shadow: 0 1px 8px rgba(0, 0, 0, .8); }
.eyebrow .dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; vertical-align: 1px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(224, 58, 62, .25); }
.mast h1 { font: 900 clamp(40px, 10.5vw, 104px)/.86 var(--display); letter-spacing: -.005em; text-transform: uppercase;
  text-shadow: 0 4px 24px rgba(0, 0, 0, .55); }
.mast h1 small { display: block; font-size: .42em; line-height: 1; letter-spacing: .04em; color: var(--fg); margin-bottom: .08em; }
.mast h1 span { display: block; color: var(--accent); }
/* Pinwheel stripes: five bars, the way the Blazers mark splits red and white. */
.stripes { display: flex; gap: 4px; height: 6px; width: min(260px, 60%); }
.stripes i { flex: 1; background: var(--fg); border-radius: 1px; transform: skewX(-24deg); }
.stripes i:nth-child(odd) { background: var(--accent); }
.demo { background: var(--accent-soft); color: var(--fg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }

/* ---------- today's #1: a betting ticket ---------- */
.ticket { position: relative; background: var(--ticket); color: var(--ticket-ink); border-radius: 14px; padding: 18px 20px 16px;
  display: grid; gap: 10px; box-shadow: 0 18px 48px rgba(0, 0, 0, .55); }
.ticket .t-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.ticket .t-kind { font: 800 15px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.ticket .t-sport { font: 700 12px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ticket-muted); }
.ticket h2 { font: 800 clamp(30px, 7vw, 44px)/.95 var(--display); text-transform: uppercase; overflow-wrap: anywhere; }
.ticket .t-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.ticket .t-odds { font: 700 clamp(34px, 8vw, 48px)/1 var(--mono); letter-spacing: -.02em; }
.ticket .t-pay { font-size: 15px; color: var(--ticket-muted); text-align: right; }
.ticket .t-pay b { color: var(--ticket-ink); font-weight: 700; }
.ticket p { margin: 0; font-size: 15px; color: #2c2d31; max-width: 62ch; }
.ticket .t-stub { border-top: 2px dashed #c9c6c0; margin: 6px -20px 0; padding: 12px 20px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; position: relative; }
/* perforation notches where the stub tears off */
.ticket .t-stub::before, .ticket .t-stub::after { content: ""; position: absolute; top: -10px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); }
.ticket .t-stub::before { left: -9px; } .ticket .t-stub::after { right: -9px; }
.ticket .t-stub .meter { --track: #d9d6d0; }
.ticket .muted, .ticket .move-bad { color: var(--ticket-muted); }
.ticket .move-good { color: #1d6b3a; }
.ticket-empty { background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px dashed var(--line-2); border-radius: 14px; padding: 18px 20px; display: grid; gap: 6px; }
.ticket-empty b { font: 800 22px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
@media (prefers-reduced-motion: no-preference) {
  .ticket { animation: deal .5s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes deal { from { transform: translateY(14px) rotate(-.6deg); } to { transform: none; } }
}

/* ---------- edge meter ---------- */
.meter { --v: 0; --track: var(--line); display: inline-grid; grid-template-columns: auto 120px; align-items: center; gap: 8px; font: 700 13px/1 var(--mono); }
.meter .bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.meter .bar i { display: block; height: 100%; width: calc(var(--v) * 1%); border-radius: 4px;
  background: linear-gradient(90deg, var(--silver), var(--accent) 70%, var(--accent-2)); }
.meter .lbl { letter-spacing: .02em; }
.meter .lbl small { font: 600 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; margin-right: 4px; opacity: .75; }

/* ---------- season strip ---------- */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.board div { padding: 12px 14px; border-left: 1px solid var(--line); display: grid; gap: 3px; }
.board div:first-child { border-left: 0; }
.board span { font: 700 11px/1.2 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.board b { font: 700 22px/1.1 var(--mono); }
.board small { color: var(--muted); font-size: 13px; }
@media (max-width: 560px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .board div:nth-child(3) { border-left: 0; } .board div:nth-child(n+3) { border-top: 1px solid var(--line); } }

/* ---------- tabs + filters ---------- */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding-block: 4px;
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.tabs button { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px 8px; cursor: pointer;
  font: 800 17px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs .count { font: 700 11px var(--mono); margin-left: 5px; padding: 2px 5px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-2); vertical-align: 2px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: color-mix(in srgb, var(--surface) 90%, transparent); border: 1px solid var(--line); border-radius: 999px; padding: 3px; overflow-x: auto; max-width: 100%; }
.seg button { flex: none; background: none; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

/* ---------- sections ---------- */
.panel { background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; }
.panel-head h2 { font: 800 24px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.panel-head .muted { font-size: 14px; }
.empty { color: var(--muted); font-size: 15px; margin: 0; }
.grid { display: grid; gap: 14px; }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
@media (max-width: 680px) { .grid.three { grid-template-columns: minmax(0, 1fr); } }

/* ---------- top 10 ---------- */
.top { display: grid; }
.bet { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 4px 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.bet:first-child { border-top: 0; padding-top: 4px; }
.bet .rk { grid-row: span 3; font: 900 44px/.9 var(--display); color: var(--line-2); text-align: center; }
.bet:nth-child(-n+3) .rk { color: var(--accent); }
.bet .sel { display: flex; gap: 6px 8px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
.bet .sel strong { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
.bet .price { text-align: right; grid-row: span 2; }
.bet .price b { font: 700 20px/1.1 var(--mono); display: block; }
.bet .price small { color: var(--muted); font-size: 13px; white-space: nowrap; }
.bet .sub { font-size: 14px; color: var(--muted); }
.bet .gauge { grid-column: 2 / -1; display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap; }
.bet .why, .bet .meta, .bet details.more { grid-column: 2 / -1; }
@media (max-width: 520px) { .bet { grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 10px; } .bet .rk { font-size: 32px; } }

/* ---------- picks of the day ---------- */
.potd { position: relative; border-radius: 12px; padding: 14px; display: grid; gap: 6px; align-content: start;
  background: var(--surface-2); border: 1px solid var(--line); }
.potd .kind { font: 800 15px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--accent-2); }
.potd h3 { font: 700 19px/1.15 var(--body); overflow-wrap: anywhere; }
.potd .price { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.potd .price b { font: 700 28px/1 var(--mono); }
.potd p { margin: 0; font-size: 14px; color: var(--muted); }

/* ---------- tags ---------- */
.tag { display: inline-block; font: 700 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; border-radius: 6px;
  padding: 4px 6px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.tag.lock { background: var(--win-soft); color: var(--win); border-color: transparent; }
.tag.dog, .tag.early { background: var(--accent-soft); color: var(--accent-2); border-color: transparent; }
.tag.prop { background: var(--info-soft); color: var(--info); border-color: transparent; }
.tag.live, .tag.live_win, .tag.live_plus { background: var(--live-soft); color: var(--accent-2); border-color: transparent; }
.tag.won { background: var(--win-soft); color: var(--win); border-color: transparent; }
.tag.lost { background: var(--loss-soft); color: var(--loss); border-color: transparent; }
.tag.sport { background: none; }
.parlay { border-radius: 12px; padding: 14px; display: grid; gap: 8px; align-content: start; background: var(--surface-2); border: 1px solid var(--line); }
.parlay .kind { font: 800 15px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--accent-2); }
.parlay .price { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.parlay .price b { font: 700 28px/1 var(--mono); }
.parlay ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
.parlay li small { color: var(--muted); }
.parlay li.won { color: var(--win); } .parlay li.lost { color: var(--loss); }

/* ---------- board rows ---------- */
.game { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; }
.game:first-child { border-top: 0; padding-top: 0; }
.game-head { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); font-weight: 600; flex-wrap: wrap; }
.game-head b { color: var(--fg); }
.row, .bet, .parlay { position: relative; }
.stamp { position: absolute; top: 50%; left: 50%; z-index: 2; transform: translate(-50%, -50%) rotate(-11deg);
  font: 900 clamp(26px, 7vw, 46px)/1 var(--display); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
  color: #3ddc84; border: 4px solid #3ddc84; border-radius: 10px; padding: 6px 16px; pointer-events: none;
  background: color-mix(in srgb, var(--bg) 55%, transparent); box-shadow: 0 0 16px color-mix(in srgb, #3ddc84 35%, transparent); }
@media (prefers-reduced-motion: no-preference) { .stamp { animation: slam .35s cubic-bezier(.2, .8, .2, 1.4) both; } }
@keyframes slam { from { transform: translate(-50%, -50%) rotate(-11deg) scale(2.2); opacity: 0; } }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 0; }
.row + .row { border-top: 1px dashed var(--line); }
.row .sel { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
.row .sel strong { font-size: 17px; overflow-wrap: anywhere; }
.row .odds { text-align: right; }
.row .odds b { font: 700 18px/1.2 var(--mono); display: block; }
.row .odds small { color: var(--muted); font-size: 13px; }
.row .why, .row .meta, .row details.more { grid-column: 1 / -1; }
.why { font-size: 14px; color: var(--muted); margin: 0; max-width: 70ch; }
.meta { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.move-good { color: var(--win); font-weight: 600; } .move-bad { color: var(--muted); }
.live-dot { color: var(--accent-2); font-weight: 700; }
.live-dot::before { content: "● "; }
details.more summary { cursor: pointer; color: var(--silver); font-size: 14px; font-weight: 700; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: " ›"; }
details.more[open] summary::after { content: " ‹"; }
details.more ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; display: grid; gap: 3px; color: var(--silver); }

/* ---------- live ---------- */
.slot { border: 1px solid var(--line); border-top: 3px solid var(--live); border-radius: 12px; padding: 12px; background: var(--surface-2); display: grid; gap: 4px; }
.slot.plus { border-top-color: var(--silver); }
.slot .kind { font: 800 14px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* ---------- results + model ---------- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.stat span { font: 700 11px/1.2 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stat b { font: 700 20px/1.15 var(--mono); }
.stat small { font-size: 13px; color: var(--muted); }
.chart { width: 100%; height: 110px; display: block; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { padding: 8px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th.text, td.text { text-align: left; white-space: normal; min-width: 11em; }
th { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
td { font-variant-numeric: tabular-nums; }
.model ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.pill { display: inline-block; font: 700 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: 4px 8px; }
.pill.ok { background: var(--win-soft); color: var(--win); }
.pill.wait { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.calib { width: 100%; max-width: 360px; height: auto; display: block; }

footer { color: var(--muted); font-size: 14px; display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 12px; }
</style>

<div class="photo-bg" aria-hidden="true" style="--mascot: url('__MASCOT__'); --thumb: url('__THUMB__')"></div>
<main class="wrap">
  <header class="mast">
    <p class="eyebrow" id="updated"><span class="dot"></span>Loading…</p>
    <h1><small>Follow Me,</small><span>Instead Of Your Dreams</span></h1>
    <div class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </header>
  <div id="demo"></div>
  <section id="hero" aria-label="Today's number one pick"></section>
  <section class="board" id="scoreboard" aria-label="Season record"></section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <div class="filters"><div class="seg" id="sports" aria-label="Sport"></div><div class="seg" id="markets" aria-label="Bet type"></div></div>
  <div id="view" class="grid"></div>
  <footer>
    <span>Picks only; no bets are placed. Parlays: every leg has to win.</span>
    <span>No model wins every bet. Judge it by the record and the closing-line value over many picks. Bet only what you can afford to lose.</span>
  </footer>
</main>

<script id="edge-data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  let DATA = JSON.parse(document.getElementById("edge-data").textContent);
  const SOCCER = new Set(["epl", "laliga", "bundesliga", "seriea", "ligue1", "mls", "ucl"]);
  const SPORTS = [["all", "All"], ["nfl", "NFL"], ["nba", "NBA"], ["mlb", "MLB"], ["nhl", "NHL"], ["soccer", "Soccer"]];
  const MARKETS = [["all", "All bets"], ["spreads", "Spreads"], ["totals", "O/U"], ["props", "Props"], ["moneyline", "ML"]];
  const TABS = [["today", "Today"], ["parlays", "Parlays"], ["live", "Live"], ["props", "Props"], ["early", "Early"], ["results", "Results"]];
  const TIER = { lock: "Lock", dog: "Dog", prop: "Prop of the day", value: "Value", early: "Early", lean: "Lean",
    live: "Live", live_win: "Live · likely winner", live_plus: "Live · plus money", sharp: "Sharp value" };
  const state = { tab: "today", sport: "all", market: "all" };
  try { Object.assign(state, JSON.parse(localStorage.getItem("fb-state") || "{}")); } catch (e) {}
  if (!TABS.some(([k]) => k === state.tab)) state.tab = "today";  // e.g. a saved tab that no longer exists
  const save = () => { try { localStorage.setItem("fb-state", JSON.stringify(state)); } catch (e) {} };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const odds = (a) => (a > 0 ? "+" : "") + Math.round(a);
  const dec = (a) => (a > 0 ? 1 + a / 100 : 1 + 100 / -a);
  const implied = (a) => 1 / dec(a);
  const toAmerican = (d) => (d >= 2 ? Math.round((d - 1) * 100) : Math.round(-100 / (d - 1)));
  const pct = (x, d = 0) => (x == null ? "–" : (x * 100).toFixed(d) + "%");
  const signed = (x, d = 1) => (x == null ? "–" : (x >= 0 ? "+" : "") + x.toFixed(d));
  const money = (x) => (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const tz = DATA.tz || undefined;
  const fmt = (iso, o) => new Date(iso).toLocaleString(undefined, Object.assign({ timeZone: tz }, o));
  const dayOf = (iso) => new Date(iso).toLocaleDateString("en-CA", { timeZone: tz });
  const groupOf = (e) => (e.player ? "props" : e.market === "spreads" ? "spreads" : e.market === "totals" ? "totals" : "moneyline");
  const sportGroup = (k) => (SOCCER.has(k) ? "soccer" : k);
  const isLive = (e) => (e.tier || "").startsWith("live");
  const isOpen = (e) => e.status === "pending" && new Date(e.commence_time) > new Date();
  const visible = (e) => (state.sport === "all" || sportGroup(e.sport) === state.sport) && (state.market === "all" || groupOf(e) === state.market);
  const today = () => dayOf(DATA.generated_at);
  const onBoard = (e) => visible(e) && e.status !== "void" && (!e.settled || e.day === today());
  const cls = (x) => (x == null ? "" : x >= 0 ? "pos" : "neg");
  const rec = (s) => `${s.won}-${s.lost}${s.push ? "-" + s.push : ""}`;
  const units = (e) => (e.units > 0 ? `${e.units === 0.5 ? "½" : e.units}u` : "lean");
  const timeOf = (e) => fmt(e.commence_time, { weekday: "short", hour: "numeric", minute: "2-digit" });
  const wins = (e) => `$100 wins $${(100 * (dec(e.odds) - 1)).toFixed(0)}`;
  // Our win chance next to what the price needs to break even: a good bet always wins more than it needs.
  const needs = (e) => `wins ${pct(e.win_prob)} · needs ${pct(implied(e.odds))}`;
  const SETTLED = { won: "Won", lost: "Lost", push: "Push", void: "Void", half_won: "Half won", half_lost: "Half lost" };
  const LABEL = { h2h: "Moneyline", spreads: "Spread", totals: "Total" };

  // Edge score 0-100: 60 points of edge (full at +10% EV), 40 of chance to cash (full at 75%).
  // Picks published before scores existed get the same formula on their stored numbers.
  function score(e) {
    if (e.score != null) return e.score;
    const q = e.win_prob, ev = q * (dec(e.odds) - 1) - (1 - q);
    return Math.round(10 * (60 * Math.min(Math.max(ev / 0.1, 0), 1) * Math.min(q / 0.45, 1) + 40 * Math.min(Math.max((q - 0.4) / 0.35, 0), 1))) / 10;
  }
  const meter = (e) => { const v = Math.round(score(e));
    return `<span class="meter" style="--v:${v}" role="img" aria-label="Edge score ${v} out of 100"><span class="lbl"><small>Edge</small>${v}</span><span class="bar"><i></i></span></span>`; };

  function moveText(e) {
    if (e.current_odds == null || e.settled || isLive(e)) return "";
    const moved = e.current_point != null && e.point != null && e.current_point !== e.point;
    if (e.current_odds === e.odds && !moved) return `<span class="muted">Line steady at ${odds(e.odds)}</span>`;
    const now = moved ? `${e.current_point > 0 ? "+" : ""}${e.current_point} ${odds(e.current_odds)}` : odds(e.current_odds);
    const beat = implied(e.current_odds) > implied(e.odds) || (moved && e.market === "spreads" && e.current_point < e.point);
    return beat ? `<span class="move-good">Got ${odds(e.odds)}, now ${now}: beat the line</span>` : `<span class="move-bad">Got ${odds(e.odds)}, now ${now}</span>`;
  }
  function statusText(e) {
    if (SETTLED[e.status]) {
      const c = e.status.replace("half_", "");
      const p = e.units > 0 && e.profit != null ? ` ${signed(e.profit, 2)}u` : "";
      return `<span class="tag ${c}">${SETTLED[e.status]}</span> <span class="muted">${esc(e.final || "")}${e.result_value != null ? " · finished " + e.result_value : ""}${p}</span>`;
    }
    if (e.status === "live" && e.live) return `<span class="live-dot">${esc(e.away)} ${e.live.away ?? ""}, ${esc(e.home)} ${e.live.home ?? ""} · ${esc(e.live.detail || "")}</span>`;
    return "";
  }
  const addBtn = () => "";  // straight bets only: no parlay slip
  const more = (e) => (e.reasons && e.reasons.length ? `<details class="more"><summary>Stats &amp; why</summary><ul>${e.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul></details>` : "");
  // A won bet gets a green "Cashed" stamp across it.
  function stamp(e) {
    return ["won", "half_won"].includes(e.status) ? `<span class="stamp">Cashed</span>` : "";
  }
  function row(e, opts = {}) {
    return `<div class="row">${stamp(e)}
      <div class="sel"><span class="tag ${e.tier}">${TIER[e.tier] || e.tier}</span><strong>${esc(e.selection.replace(" (live)", ""))}</strong></div>
      <div class="odds"><b>${odds(e.odds)}</b><small>${units(e)} · ${needs(e)}</small></div>
      <p class="why">${esc(e.headline)}</p>
      <div class="meta">${opts.matchup ? `<span class="muted">${esc(e.matchup)} · ${timeOf(e)}</span>` : ""}${moveText(e)}${statusText(e)}${addBtn(e)}</div>
      ${more(e)}</div>`;
  }
  function bet(e) {
    const kind = e.player ? "Prop" : LABEL[e.market] || e.market_label;
    return `<article class="bet">${stamp(e)}
      <div class="rk" aria-label="Rank ${e.rank}">${e.rank}</div>
      <div class="sel"><strong>${esc(e.selection)}</strong><span class="tag">${esc(kind)}</span>${["lock", "dog", "prop"].includes(e.tier) ? `<span class="tag ${e.tier}">${TIER[e.tier]}</span>` : ""}</div>
      <div class="price"><b>${odds(e.odds)}</b><small>${units(e)} · ${signed(e.ev * 100, 1)}% EV</small></div>
      <div class="sub">${esc(e.sport_name)} · ${esc(e.matchup)} · ${timeOf(e)}</div>
      <div class="gauge">${meter(e)}<span class="small muted">${needs(e)}</span></div>
      <p class="why">${esc(e.headline)}</p>
      <div class="meta">${moveText(e)}${statusText(e)}${addBtn(e)}</div>
      ${more(e)}</article>`;
  }
  const empty = (msg) => `<p class="empty">${msg}</p>`;
  const panel = (title, aside, body) => `<section class="panel"><div class="panel-head"><h2>${title}</h2><span class="muted">${aside || ""}</span></div>${body}</section>`;

  function byGame(list) {
    const games = new Map();
    list.forEach((e) => { if (!games.has(e.event_id)) games.set(e.event_id, []); games.get(e.event_id).push(e); });
    return [...games.values()].sort((a, b) => new Date(a[0].commence_time) - new Date(b[0].commence_time)).map((g) => {
      const e = g[0];
      return `<div class="game"><div class="game-head"><span><b>${esc(e.matchup)}</b> · ${esc(e.sport_name)}</span><span>${timeOf(e)}</span></div>
        ${g.sort((a, b) => b.ev - a.ev).map((x) => row(x)).join("")}</div>`;
    }).join("");
  }

  // Picks join the top bets across the day's scans; show them ordered by edge score, numbered by that order.
  const bestToday = () => DATA.entries.filter((e) => e.best_rank && e.day === today() && visible(e))
    .sort((a, b) => score(b) - score(a) || a.best_rank - b.best_rank).map((e, i) => Object.assign({}, e, { rank: i + 1 }));

  function renderHero() {
    const e = bestToday()[0] || DATA.entries.filter((x) => x.tier === "lock" && onBoard(x) && !x.settled).sort((a, b) => b.units - a.units)[0];
    if (!e) {
      $("hero").innerHTML = `<div class="ticket-empty"><b>Bet on it, the heat is coming</b></div>`;
      return;
    }
    const kind = e.best_rank && e.day === today() ? "Today's #1 best bet" : e.units > 0 ? "Lock of the day" : "Lock of the day · no units today";
    $("hero").innerHTML = `<div class="ticket">${stamp(e)}
      <div class="t-head"><span class="t-kind">${kind}</span><span class="t-sport">${esc(e.sport_name)} · ${esc(e.player ? "Prop" : LABEL[e.market] || e.market_label)} · ${timeOf(e)}</span></div>
      <h2>${esc(e.selection)}</h2>
      <div class="t-row"><span class="t-odds">${odds(e.odds)}</span><span class="t-pay">${units(e)} · ${wins(e)}<br><b>wins ${pct(e.win_prob)}</b> on our numbers · needs ${pct(implied(e.odds))}</span></div>
      <p>${esc(e.headline)}</p>
      <div class="t-stub">${meter(e)}<span class="small muted">${esc(e.matchup)}</span><span>${statusText(e)} ${moveText(e)}</span>${addBtn(e)}</div>
    </div>`;
  }

  function viewToday() {
    const items = DATA.entries.filter(onBoard);
    const potd = ["lock", "dog", "prop"].map((t) => {
      // A real (units) pick beats a lean one posted earlier the same day.
      const e = items.filter((x) => x.tier === t).sort((a, b) => b.units - a.units)[0];
      const label = { lock: "Lock of the day", dog: "Dog of the day", prop: "Prop of the day" }[t]
        + (e && !(e.units > 0) ? (t === "lock" ? " · no units today" : " · lean, no units") : "");
      if (!e) return `<div class="potd"><span class="kind">${label}</span><p class="muted">Bet on it, the heat is coming</p></div>`;
      return `<div class="potd">${stamp(e)}<span class="kind">${label}</span><h3>${esc(e.selection)}</h3>
        <div class="price"><b>${odds(e.odds)}</b><span class="muted">${units(e)} · ${wins(e)}</span></div><p class="small">${needs(e)}</p>
        <p>${esc(e.matchup)} · ${timeOf(e)}</p>${meter(e)}<p>${esc(e.headline)}</p><div class="meta">${statusText(e)} ${moveText(e)}${addBtn(e)}</div>${more(e)}</div>`;
    }).join("");
    const best = bestToday();
    const sharpBets = items.filter((e) => e.tier === "sharp");
    const rest = items.filter((e) => !isLive(e) && !["early", "lean", "sharp"].includes(e.tier) && !e.player && !e.best_rank);
    const leans = items.filter((e) => e.tier === "lean");
    const topNote = best.length ? `${best.length} of 10 cleared the bar · ranked by edge score` : "Ranked by edge score";
    return panel("Top bets today", topNote, best.length ? `<div class="top">${best.map(bet).join("")}</div>` : empty("Bet on it, the heat is coming."))
      + (sharpBets.length ? panel("Sharp value", "A sportsbook paying more than Pinnacle's fair price", byGame(sharpBets)) : "")
      + panel("Picks of the day", fmt(DATA.generated_at, { weekday: "long", month: "long", day: "numeric" }), `<div class="grid three">${potd}</div>`)
      + panel("The board", "Every other game-line play today, by game", rest.length ? byGame(rest) : empty("No other game-line plays on today's board."))
      + (leans.length ? panel("Leans", "No units, tracked anyway", byGame(leans)) : "");
  }

  // Parlays of the day: posted once, from the best bets, one leg per game.
  const byId = () => new Map(DATA.entries.map((e) => [e.id, e]));
  const PSTATUS = { won: "Won", lost: "Lost", push: "Push", void: "Void", live: "In play", pending: "Open" };
  function parlayCard(p, ids) {
    const legs = p.legs.map((id, i) => {
      const e = ids.get(id);
      if (!e) return `<li><small>leg no longer shown</small></li>`;
      const c = SETTLED[e.status] ? e.status.replace("half_", "") : "";
      return `<li class="${c}"><b>${esc(e.selection)}</b> ${odds(p.leg_odds[i])}<br><small>${esc(e.sport_name)} · ${esc(e.matchup)} · ${timeOf(e)}${SETTLED[e.status] ? " · " + SETTLED[e.status] : ""}</small></li>`;
    }).join("");
    const st = PSTATUS[p.status] || p.status;
    const res = p.profit != null ? ` ${signed(p.profit, 2)}u` : "";
    return `<div class="parlay">${p.status === "won" ? `<span class="stamp">Cashed</span>` : ""}<span class="kind">${p.size}-team parlay</span>
      <div class="price"><b>${odds(p.american)}</b><span class="muted">${p.units > 0 ? p.units + "u" : "no units, tracked"} · $10 pays $${(10 * p.decimal).toFixed(2)}</span></div>
      <p class="small"><b>Hits ${pct(p.hit_prob, p.hit_prob < 0.1 ? 1 : 0)}</b> of the time on our numbers <span class="muted">(about 1 in ${Math.max(1, Math.round(1 / p.hit_prob))})</span></p>
      <ol>${legs}</ol>
      <div class="meta"><span class="tag ${p.status}">${st}</span><span class="muted">${res}</span></div></div>`;
  }
  function viewParlays() {
    const ps = DATA.parlays || [], ids = byId();
    const todays = ps.filter((p) => p.day === today()).sort((a, b) => a.size - b.size);
    const earlier = ps.filter((p) => p.day !== today()).sort((a, b) => b.day.localeCompare(a.day) || a.size - b.size);
    const note = "";
    const st = (DATA.stats && DATA.stats.parlays) || {};
    const rows = [2, 3, 4, 8].map((n) => { const s = st[n] || { won: 0, lost: 0, units: 0 };
      return `<tr><td>${n}-team</td><td>${rec(s)}</td><td class="${cls(s.units)}">${signed(s.units, 2)}u</td><td>${s.roi == null ? "–" : signed(s.roi * 100, 0) + "%"}</td></tr>`; }).join("");
    return panel("Parlays of the day", "Most likely winners first, one leg per game · posted once a day",
        (todays.length ? `<div class="grid two">${todays.map((p) => parlayCard(p, ids)).join("")}</div>` : "") + note
        + `<p class="small muted">Every leg has to win, and the book's edge stacks on every leg, so parlays lose more often than straight bets. Stakes stay small: ½u on a 2-team, ¼u on a 3- or 4-team, 0.1u on an 8-team.</p>`)
      + panel("Parlay record", "Kept apart from the straight-bet record",
        `<div class="table-wrap"><table><thead><tr><th>Parlay</th><th>Record</th><th>Profit</th><th>ROI</th></tr></thead><tbody>${rows}</tbody></table></div>`)
      + (earlier.length ? panel("Earlier parlays", "Last 7 days", `<div class="grid two">${earlier.map((p) => parlayCard(p, ids)).join("")}</div>`) : "");
  }

  function viewLive() {
    const items = DATA.entries.filter((e) => isLive(e) && onBoard(e)).sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
    const latest = (t) => items.find((e) => e.tier === t);
    const slot = (t, title, extra) => { const e = latest(t);
      return `<div class="slot ${extra}"><span class="kind">${title}</span>${e ? row(e, { matchup: true }) : `<p class="empty">Bet on it, the heat is coming</p>`}</div>`; };
    const shown = new Set([latest("live_win"), latest("live_plus")].filter(Boolean).map((e) => e.id));
    const earlier = items.filter((e) => !shown.has(e.id));
    return panel("Live right now", items.length ? `${items.length} live bets today` : "",
        `<div class="grid two">${slot("live_win", "Most likely to win · 60%+", "")}${slot("live_plus", "Live plus money", "plus")}</div>`)
      + (earlier.length ? panel("Earlier live bets", "", earlier.map((e) => row(e, { matchup: true })).join("")) : "");
  }

  function viewList(filter, title, aside, msg) {
    const items = DATA.entries.filter((e) => onBoard(e) && filter(e)).sort((a, b) => score(b) - score(a));
    return panel(title, aside, items.length ? items.map((e) => row(e, { matchup: true })).join("") : empty(msg));
  }

  function chart(curve, start) {
    if (!curve.length) return "";
    const pts = [start, ...curve.map((c) => c[1])];
    const lo = Math.min(...pts), hi = Math.max(...pts), W = 700, H = 110, pad = 8, span = hi - lo || 1;
    const x = (i) => pad + (i / (pts.length - 1)) * (W - 2 * pad), y = (v) => H - pad - ((v - lo) / span) * (H - 2 * pad);
    const d = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    const col = pts[pts.length - 1] >= start ? "var(--win)" : "var(--loss)";
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Bankroll over time">
      <line x1="0" x2="${W}" y1="${y(start)}" y2="${y(start)}" stroke="var(--line-2)" stroke-dasharray="4 4"/>
      <path d="${d}L${x(pts.length - 1)},${H}L${x(0)},${H}Z" fill="${col}" opacity=".12"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }
  function viewResults() {
    const st = DATA.stats;
    const tierRows = [["lock", "Lock of the day"], ["dog", "Dog of the day"], ["prop", "Prop of the day"], ["value", "Value plays"], ["early", "Early value"], ["live_win", "Live · likely winner"], ["live_plus", "Live · plus money"]]
      .map(([k, n]) => { const s = st.by_tier[k] || { won: 0, lost: 0, units: 0 }; return `<tr><td>${n}</td><td>${rec(s)}</td><td class="${cls(s.units)}">${signed(s.units, 1)}u</td><td>${s.roi == null ? "–" : signed(s.roi * 100, 0) + "%"}</td></tr>`; }).join("")
      + (st.lock_all ? `<tr><td>Lock of the day, every day (bet or not)</td><td>${rec(st.lock_all)}</td><td class="${cls(st.lock_all.units)}">${signed(st.lock_all.units, 1)}u</td><td>${st.lock_all.roi == null ? "–" : signed(st.lock_all.roi * 100, 0) + "%"}</td></tr>` : "");
    const typeRows = [["spreads", "Spreads"], ["totals", "Over/Under"], ["props", "Props"], ["moneyline", "Moneyline"]]
      .map(([k, n]) => { const s = st.by_market[k]; return `<tr><td>${n}</td><td>${rec(s)}</td><td class="${cls(s.units)}">${signed(s.units, 1)}u</td><td class="${cls(s.clv)}">${s.clv == null ? "–" : signed(s.clv * 100, 1) + "%"}</td></tr>`; }).join("");
    const sportRows = Object.entries(st.by_sport).map(([k, s]) => `<tr><td>${esc(s.name)}</td><td>${rec(s)}</td><td>${pct(s.win_pct)}</td><td class="${cls(s.units)}">${signed(s.units, 1)}u</td></tr>`).join("");
    const b = st.best || { won: 0, lost: 0, units: 0 };
    const labels = DATA.spot_labels || {};
    const spotRows = Object.entries(st.by_spot || {}).map(([k, s]) => `<tr><td>${esc(labels[k] || k)}</td><td>${rec(s)}</td><td class="${cls(s.units)}">${signed(s.units, 1)}u</td><td class="${cls(s.clv)}">${s.clv == null ? "–" : signed(s.clv * 100, 1) + "%"}</td></tr>`).join("");
    const recent = DATA.entries.filter((e) => e.settled && e.status !== "void" && visible(e)).sort((a, b) => (b.graded_at || "").localeCompare(a.graded_at || "")).slice(0, 15);
    const au = st.audit || {};
    const auRow = (k, n) => { const s = au[k]; if (!s) return ""; return `<tr><td>${n}</td><td>${rec(s)}</td><td class="${cls(s.units)}">${signed(s.units, 1)}u</td><td>${s.roi == null ? "–" : signed(s.roi * 100, 1) + "%"}</td><td class="${cls(s.clv)}">${s.clv == null ? "–" : signed(s.clv * 100, 1) + "%"}</td><td>${pct(s.beat_close)}</td></tr>`; };
    const calRows = (st.calibration || []).filter((c) => c.n >= 5).map((c) => `<tr><td>${pct(c.said)}</td><td class="${Math.abs(c.won - c.said) <= 0.05 ? "pos" : "neg"}">${pct(c.won)}</td><td>${c.n}</td></tr>`).join("");
    const auditPanel = panel("Audit", "Recent vs all-time, to catch drift early",
      `<div class="table-wrap"><table><thead><tr><th>Window</th><th>Record</th><th>Profit</th><th>ROI</th><th>Avg CLV</th><th>Beat close</th></tr></thead><tbody>${auRow("30", "Last 30 days")}${auRow("90", "Last 90 days")}${auRow("all", "All time")}</tbody></table></div>
       ${calRows ? `<p class="empty">Did our win chances come true? Every graded pick, by the chance we gave it.</p><div class="table-wrap"><table><thead><tr><th>We said</th><th>Actually won</th><th>Picks</th></tr></thead><tbody>${calRows}</tbody></table></div>` : ""}`);
    return auditPanel + panel("Bankroll", `Started at ${money(st.start_bankroll)} · 1 unit = ${money(st.unit_value)}`,
        `<div class="stats"><div class="stat"><span>Bankroll</span><b class="${cls(st.bankroll - st.start_bankroll)}">${money(st.bankroll)}</b></div>
         <div class="stat"><span>Top bets</span><b class="${cls(b.units)}">${rec(b)}</b><small>${signed(b.units || 0, 1)}u</small></div>
         <div class="stat"><span>Last 7 days</span><b class="${cls(st.last7.units)}">${signed(st.last7.units, 1)}u</b><small>${rec(st.last7)}</small></div></div>${chart(st.curve, st.start_bankroll)}`)
      + panel("By pick type", "", `<div class="table-wrap"><table><thead><tr><th>Pick</th><th>W-L</th><th>Units</th><th>ROI</th></tr></thead><tbody>${tierRows}</tbody></table></div>`)
      + panel("By bet type", "CLV: our price vs the closing line", `<div class="table-wrap"><table><thead><tr><th>Bet</th><th>W-L</th><th>Units</th><th>CLV</th></tr></thead><tbody>${typeRows}</tbody></table></div>`)
      + (sportRows ? panel("By sport", "", `<div class="table-wrap"><table><thead><tr><th>Sport</th><th>W-L</th><th>Win</th><th>Units</th></tr></thead><tbody>${sportRows}</tbody></table></div>`) : "")
      + panel("By early-bet spot", "Each spot keeps its own record · leans count as 1u", spotRows
          ? `<div class="table-wrap"><table><thead><tr><th>Spot</th><th>W-L</th><th>Units</th><th>CLV</th></tr></thead><tbody>${spotRows}</tbody></table></div>`
          : empty("No graded picks in a spot yet."))
      + panel("Latest graded", "", recent.length ? recent.map((e) => row(e, { matchup: true })).join("") : empty("Results appear after games finish."));
  }

  // Calibration chart: what the engine said (x) against how often it won (y), to scale, 0-100% both ways.
  function calibChart(points) {
    if (!points || points.length < 3) return "";
    const W = 320, H = 220, L = 40, B = 30, T = 10, R = 10, x = (p) => L + p * (W - L - R), y = (p) => H - B - p * (H - B - T);
    const ticks = [0, 0.25, 0.5, 0.75, 1];
    const grid = ticks.map((t) => `<line x1="${x(0)}" x2="${x(1)}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" fill="var(--muted)" font-size="11">${t * 100}%</text><text x="${x(t)}" y="${H - B + 16}" text-anchor="middle" fill="var(--muted)" font-size="11">${t * 100}%</text>`).join("");
    const maxN = Math.max(...points.map((p) => p[2]));
    const dots = points.map(([said, won, n]) => `<circle cx="${x(said).toFixed(1)}" cy="${y(won).toFixed(1)}" r="${(3 + 5 * Math.sqrt(n / maxN)).toFixed(1)}" fill="var(--accent)" fill-opacity=".85"><title>said ${pct(said)}, won ${pct(won)} of ${n}</title></circle>`).join("");
    return `<svg class="calib" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calibration: predicted against actual win rate">${grid}
      <line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--silver)" stroke-dasharray="4 4"/>${dots}
      <text x="${x(0.5)}" y="${H - 2}" text-anchor="middle" fill="var(--muted)" font-size="11">we said</text></svg>`;
  }
  function viewModel() {
    const b = (DATA.brains || []).filter((x) => x.games);
    const all = b.reduce((a, x) => ({ g: a.g + x.games, w: a.w + x.accuracy * x.games }), { g: 0, w: 0 });
    const keys = (b.find((x) => x.sport === "nfl") || {}).key_numbers || [];
    const rows = b.map((x) => `<tr><td>${esc(x.name)}</td><td>${x.games}</td><td>${pct(x.accuracy, 1)}</td><td class="${x.log_loss <= x.baseline_log_loss ? "pos" : "neg"}">${signed((1 - x.log_loss / x.baseline_log_loss) * 100, 1)}%</td></tr>`).join("");
    const weights = Object.entries(DATA.weights || {}).map(([k, w]) => `${esc(k.replace(":", " "))} ${(100 - w * 100).toFixed(0)}% model`).join(" · ");
    const studies = (DATA.studies || []).filter((s) => s.games);
    const wl = (r) => (r && r.bets ? `${Math.round(r.won)}-${Math.round(r.lost)}` : "–");
    const roiCell = (r) => `<td class="${cls(r && r.roi)}">${!r || r.roi == null ? "–" : signed(r.roi * 100, 1) + "%"}</td>`;
    const sRows = studies.map((s) => {
      const blind = s.blind || s.best;
      return `<tr><td>${esc(s.name)}</td><td>${s.games.toLocaleString()}</td><td>${(s.weight * 100).toFixed(0)}% · ${(s.min_ev * 100).toFixed(0)}%+</td><td>${s.carryover == null ? "–" : Math.round(s.carryover * 100) + "%"}</td><td>${wl(s.in_sample)}</td>${roiCell(s.in_sample)}<td>${wl(blind)}</td>${roiCell(blind)}${roiCell(s.early_blind)}<td>${s.proven ? `<span class="pill ok">Proven blind</span>` : `<span class="pill wait">Not yet</span>`}</td></tr>`; }).join("");
    const big = studies.slice().sort((a, b) => b.sides - a.sides)[0];
    const studyPanel = studies.length ? panel("Studies", `Replayed against real closing odds${big && big.window ? " · " + esc(big.window) : ""}`,
        `<p class="empty">Every finished game is re-priced the way the engine prices today's games, using only what was known before it, then graded at the real closing line. Settings are tuned on the older games, then tested blind on newer games they never saw. Only the blind column counts: if an idea only works on the games it was tuned on, it's dead. Early = the same picks at the opening line, before the market moved. Last season = how much last season's games still count in the ratings (lower means early-season ratings are pulled toward average).</p>
         <div class="table-wrap"><table><thead><tr><th>Sport</th><th>Games</th><th>Trust · edge</th><th>Last season</th><th>Tuned W-L</th><th>Tuned ROI</th><th>Blind W-L</th><th>Blind ROI</th><th>Early ROI</th><th>Status</th></tr></thead><tbody>${sRows}</tbody></table></div>
         ${big && big.calibration && big.calibration.length >= 3 ? `<div class="grid two"><div>${calibChart(big.calibration)}</div><p class="empty">${esc(big.name)}: each dot is a group of past lines. Dots on the dashed line mean that when the engine said 60%, those bets won 60% of the time. The edge score uses this to correct its win odds before ranking.</p></div>` : ""}`)
      : panel("Studies", "", empty("The first study runs on the next daily cycle (8:47 AM Pacific) and fills this in."));
    const lRows = studies.filter((s) => s.learned && s.learned.log_loss_market != null).map((s) => { const l = s.learned;
      return `<tr><td>${esc(s.name)}</td><td>${l.tune_rows.toLocaleString()} / ${l.blind_rows.toLocaleString()}</td><td>${l.log_loss_market.toFixed(3)}</td><td class="${l.beats_market ? "pos" : "neg"}">${l.log_loss_learned.toFixed(3)}</td><td class="${l.log_loss_nn != null && l.log_loss_nn < l.log_loss_market ? "pos" : "neg"}">${l.log_loss_nn == null ? "–" : l.log_loss_nn.toFixed(3)}</td><td>${l.bets ? Math.round(l.won) + "-" + Math.round(l.lost) : "–"}</td>${roiCell(l)}${(() => { const o = s.learned_open || {}, c = o.clv || {}; return `${roiCell(o)}<td class="${cls(c.avg)}">${c.avg == null ? "–" : signed(c.avg * 100, 1) + "%"}</td>`; })()}<td>${l.proven || (s.learned_open || {}).proven ? `<span class="pill ok">Proven blind</span>` : `<span class="pill wait">Not yet</span>`}</td></tr>`; }).join("");
    const learnPanel = lRows ? panel("Learned model", "Gradient boosting vs the closing line · blind games",
      `<p class="empty">A gradient-boosting model learns from the older games where the market's no-vig price was wrong, using rest, back-to-backs, travel, recent form, pace, starting pitchers, our ratings and advanced box-score stats (NBA efficiency and pace, NHL shot share and special teams, NFL yards per play and turnovers, soccer shots on target). A neural network is trained on the same rows for comparison. It is judged on the newer games: it must predict better than the market (lower log loss) and its 2%+ edges must make money over 60+ bets.</p>
       <div class="table-wrap"><table><thead><tr><th>Sport</th><th>Learned / blind lines</th><th>Market log loss</th><th>Learned log loss</th><th>Neural net</th><th>Blind W-L</th><th>Blind ROI</th><th>At the open: ROI</th><th>Open CLV</th><th>Status</th></tr></thead><tbody>${lRows}</tbody></table></div>`) : "";
    const spotStudy = [];
    studies.forEach((s) => (s.spots || []).forEach((r) => spotStudy.push(`<tr><td>${esc(s.name)}</td><td class="text">${esc(r.label)}</td><td>${wl(r.open_blind)}</td>${roiCell(r.open_blind)}<td>${wl(r.close_blind)}</td>${roiCell(r.close_blind)}<td class="${cls(r.open_clv)}">${r.open_clv == null ? "–" : signed(r.open_clv * 100, 1) + "%"}</td><td>${r.proven ? `<span class="pill ok">Proven blind</span>` : `<span class="pill wait">Not yet</span>`}</td></tr>`)));
    const spotPanel = spotStudy.length ? panel("Early-bet spots", "Dogs +100 to +220 (wind: the under) · blind games only",
        `<p class="empty">Each spot is judged on its own: bet every dog in that spot, at the opening line and at the close, on games the settings never saw. A spot adds weight to a pick only after it holds up blind, and all spots together are capped at 6 points of win chance on a dog.</p>
         <div class="table-wrap"><table><thead><tr><th>Sport</th><th class="text">Spot</th><th>Open W-L</th><th>Open ROI</th><th>Close W-L</th><th>Close ROI</th><th>Open CLV</th><th>Status</th></tr></thead><tbody>${spotStudy.join("")}</tbody></table></div>`) : "";
    const propRows = [];
    Object.entries(DATA.props || {}).forEach(([sport, markets]) => Object.entries(markets).forEach(([m, t]) => {
      const graded = t.over + t.under;
      propRows.push(`<tr><td>${esc(sport.toUpperCase())}</td><td>${esc(m.replace(/^player_/, "").replace(/_/g, " "))}</td><td>${t.lines}</td><td>${graded ? pct(t.over / graded) : "–"}</td><td>${t.lines ? pct(t.moved / t.lines) : "–"}</td></tr>`);
    }));
    const propPanel = panel("Prop line history", "Logged daily, graded when games end",
      propRows.length
        ? `<p class="empty">Every prop line seen is saved and graded against the real stat. Props can't be judged until this history is big enough; until then prop picks stay at half a unit.</p><div class="table-wrap"><table><thead><tr><th>Sport</th><th>Stat</th><th>Lines</th><th>Over hit</th><th>Line moved</th></tr></thead><tbody>${propRows.join("")}</tbody></table></div>`
        : empty("Prop lines are being logged every day; the first graded ones show up here after those games end."));
    const u = DATA.ufc || {};
    const um = u.market || {};
    const fightRows = (u.upcoming || []).filter((f) => f.market_a != null).map((f) => {
      const edgeA = (0.25 * f.model_a + 0.75 * f.market_a) - f.market_a;
      return `<tr><td class="text">${esc(f.a)} <small class="muted">${esc(f.a_record)}</small><br>${esc(f.b)} <small class="muted">${esc(f.b_record)}</small></td><td>${esc(f.weight)}</td><td>${odds(f.a_ml)}<br>${odds(f.b_ml)}</td><td>${pct(f.market_a)}<br>${pct(1 - f.market_a)}</td><td>${f.a_fights || f.b_fights ? pct(f.model_a) + "<br>" + pct(1 - f.model_a) : "–"}</td><td class="${cls(edgeA)}">${signed(edgeA * 100, 1)}</td></tr>`;
    }).join("");
    const ufcPanel = u.fights ? panel("UFC research", "Fighter ratings and DraftKings lines",
      `<p class="empty">Fighter ratings replayed over ${u.fights.toLocaleString()} UFC fights since 2019, each predicted before it happened: picked the winner <b>${pct(u.accuracy, 1)}</b> of the ${(u.called || 0).toLocaleString()} fights where it had a favorite (log loss ${u.log_loss == null ? "–" : u.log_loss.toFixed(3)}; a coin flip is 0.693). ESPN drops UFC odds after each fight, so lines are saved from now on: <b>${um.bets || 0} of 60</b> graded test bets so far${um.roi != null ? ", ROI " + signed(um.roi * 100, 1) + "%" : ""}.</p>
       ${fightRows ? `<div class="table-wrap"><table><thead><tr><th class="text">Fight</th><th>Class</th><th>DraftKings</th><th>Market</th><th>Ratings</th><th>Blend vs market (pts)</th></tr></thead><tbody>${fightRows}</tbody></table></div>` : empty("No upcoming fights with DraftKings lines yet.")}`) : "";
    const ct = Object.entries(DATA.clv_trust || {}).sort((a, b) => b[1].picks - a[1].picks);
    const ctLabel = (f) => f === 0 ? `<span class="pill wait">Paused</span>` : f < 1 ? `<span class="pill wait">Stakes cut</span>` : f > 1 ? `<span class="pill ok">Trusted more</span>` : `<span class="pill">Normal</span>`;
    const ctPanel = ct.length ? panel("Adapting to results", "Our own picks vs the closing line",
      `<p class="empty">Closing line value is the reward: it shows within hours whether a pick was sharp, long before wins and losses even out. Kinds of bets whose picks keep beating the close get bigger stakes; ones that keep losing to it get smaller stakes, then come off the board.</p>
       <div class="table-wrap"><table><thead><tr><th>Bet type</th><th>Picks</th><th>Avg CLV</th><th>Beat the close</th><th>Status</th></tr></thead><tbody>${ct.map(([k, v]) => `<tr><td>${esc(k.replace(":", " ").toUpperCase())}</td><td>${v.picks}</td><td class="${cls(v.avg_clv)}">${signed(v.avg_clv * 100, 1)}%</td><td>${pct(v.beat)}</td><td>${ctLabel(v.factor)}</td></tr>`).join("")}</tbody></table></div>`) : "";
    return studyPanel + learnPanel + ctPanel + spotPanel + propPanel + ufcPanel + panel("How the model is doing", b[0] ? "Retrained " + fmt(b[0].trained_at, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "",
      `<div class="model"><ul>
        ${all.g ? `<li>Picks the straight-up winner <b>${pct(all.w / all.g, 0)}</b> of the time on ${all.g.toLocaleString()} recent games it never saw.</li>` : ""}
        ${keys.length ? `<li>Learned NFL key numbers from real scores: ${keys.map((k) => k[0]).join(", ")}.</li>` : ""}
        <li>Top bets are ranked by edge score: 60 points for the size of the edge, 40 for how likely it is to cash. Only picks with a real edge and no warnings make the list.</li>
        <li>Prices blend our numbers with the market's no-vig odds. ${weights ? "Current trust: " + weights + "." : "Trust is set by the studies and re-learned from graded picks."}</li>
        <li>Live picks need the model to agree with the market's direction; a "likely winner" needs 60%+ on our numbers.</li></ul></div>
       ${rows ? `<div class="table-wrap"><table><thead><tr><th>Sport</th><th>Games</th><th>Winner</th><th>vs coin flip</th></tr></thead><tbody>${rows}</tbody></table></div>` : ""}`);
  }

  function renderTop() {
    const st = DATA.stats, o = st.overall;
    $("updated").innerHTML = `<span class="dot"></span>Sports picks engine · updated ${esc(fmt(DATA.generated_at, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))}`;
    $("demo").innerHTML = DATA.demo ? `<div class="demo">Demo data: made-up teams and odds so you can see how it works. Nothing here is a real bet.</div>` : "";
    $("scoreboard").innerHTML = `<div><span>Record</span><b>${rec(o)}</b><small>${pct(o.win_pct)} unit plays</small></div>
      <div><span>Profit</span><b class="${cls(o.units)}">${signed(o.units, 1)}u</b><small>${o.roi == null ? "–" : signed(o.roi * 100, 1) + "% ROI"}</small></div>
      <div><span>Bankroll</span><b class="${cls(st.bankroll - st.start_bankroll)}">${money(st.bankroll)}</b><small>from ${money(st.start_bankroll)}</small></div>
      <div><span>Beat the close</span><b>${pct(o.beat_close)}</b><small>avg CLV ${o.clv == null ? "–" : signed(o.clv * 100, 1) + "%"}</small></div>`;
    const counts = { today: bestToday().length, parlays: (DATA.parlays || []).filter((p) => p.day === today()).length, live: DATA.entries.filter((e) => isLive(e) && onBoard(e)).length, props: DATA.entries.filter((e) => e.player && onBoard(e)).length,
      early: DATA.entries.filter((e) => e.tier === "early" && onBoard(e)).length };
    $("tabs").innerHTML = TABS.map(([k, n]) => `<button role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${n}${counts[k] ? `<span class="count">${counts[k]}</span>` : ""}</button>`).join("");
    $("sports").innerHTML = SPORTS.map(([k, n]) => `<button data-sport="${k}" aria-pressed="${state.sport === k}">${n}</button>`).join("");
    $("markets").innerHTML = MARKETS.map(([k, n]) => `<button data-market="${k}" aria-pressed="${state.market === k}">${n}</button>`).join("");
  }

  function render() {
    renderTop();
    renderHero();
    const views = {
      today: viewToday, parlays: viewParlays, live: viewLive, results: viewResults,
      props: () => viewList((e) => e.player, "Player props", "Best edge first · priced at -115 when ESPN shows no price", "No prop edges right now. NFL and NBA props are priced every morning."),
      early: () => viewList((e) => e.tier === "early", "Early value", "More than 24 hours out · bet before the line moves", "Nothing early yet."),
    };
    $("view").innerHTML = (views[state.tab] || viewToday)();
  }

  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.tab) { state.tab = t.dataset.tab; save(); render(); }
    else if (t.dataset.sport) { state.sport = t.dataset.sport; save(); render(); }
    else if (t.dataset.market) { state.market = t.dataset.market; save(); render(); }
  });
  render();
  if (location.protocol.startsWith("http")) {
    setInterval(async () => { try { const r = await fetch("data.json", { cache: "no-store" }); if (r.ok) { DATA = await r.json(); render(); } } catch (e) {} }, 60000);
  }
})();
</script>
