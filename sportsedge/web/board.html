<title>Funky Buttlovin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a scoreboard strip, sticky tabs (Today · Live · Props · Early · Results · Model), picks grouped
   by game like a sportsbook board, and a parlay slip docked to the bottom of the screen. */
:root {
  /* Seahawks-inspired dark palette: College Navy, Action Green, Wolf Gray. One committed dark look. */
  --bg: #00152e; --surface: #002244; --surface-2: #0a2d52; --line: #1b3d63; --line-2: #2c5179;
  --fg: #f1f4f7; --muted: #a5acaf; --accent: #69be28; --accent-soft: #163f2c;
  --win: #7fd13b; --win-soft: #15402b; --loss: #f07a6a; --loss-soft: #3e2233;
  --live: #69be28; --live-soft: #163f2c; --info: #9cc7e8; --info-soft: #12355a;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); }
/* The Funky Buttlovin photo sits behind the whole engine, tinted navy so the picks stay readable.
   A fixed layer (not background-attachment) so it also stays put on phones. */
.photo-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, rgba(0, 21, 46, .05) 0%, rgba(0, 21, 46, .35) 35%, rgba(0, 21, 46, .75) 70%, rgba(0, 21, 46, .85) 100%),
    var(--mascot) 50% 0% / max(100%, 520px) auto no-repeat, var(--bg); }
/* The page opens on the photo: the name sits at the bottom of a tall header, then the picks scroll up over it. */
.mast { min-height: clamp(260px, 52vh, 560px); display: flex; flex-direction: column; justify-content: flex-end; }
.mast h1 { font-size: 38px; text-shadow: 0 2px 12px rgba(0, 0, 0, .6); }
.mast p { color: #e6eaee; text-shadow: 0 1px 6px rgba(0, 0, 0, .7); }
.panel, .board { background: color-mix(in srgb, var(--surface) 80%, transparent); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.tabs { background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 120px; display: grid;
  grid-template-columns: minmax(0, 1fr); gap: 16px; }
.wrap > *, .panel > *, .grid > * { min-width: 0; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* masthead */
.mast h1 { font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
.mast h1 span { color: var(--accent); }
.mast p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.demo { background: var(--accent-soft); color: var(--fg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }

/* scoreboard strip */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; overflow: hidden; }
.board div { padding: 12px 14px; border-left: 1px solid var(--line); display: grid; gap: 2px; }
.board div:first-child { border-left: 0; }
.board span { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.board b { font: 700 22px/1.1 var(--mono); }
.board small { color: var(--muted); font-size: 13px; }
@media (max-width: 560px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .board div:nth-child(3) { border-left: 0; } .board div:nth-child(n+3) { border-top: 1px solid var(--line); } }

/* tabs + filters */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 6px;
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.tabs button { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; cursor: pointer;
  font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent) !important; color: #00152e !important; }
.tabs .count { font: 600 12px var(--mono); margin-left: 4px; color: var(--muted); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; overflow-x: auto; max-width: 100%; }
.seg button { flex: none; background: none; border: 0; border-radius: 7px; padding: 6px 10px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel-head h2 { font-size: 18px; font-weight: 800; }
.panel-head .muted { font-size: 14px; }
.empty { color: var(--muted); font-size: 15px; margin: 0; }
.grid { display: grid; gap: 12px; }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
@media (max-width: 640px) { .grid.three { grid-template-columns: minmax(0, 1fr); } }

/* pick of the day tiles */
.potd { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; background: var(--surface-2); align-content: start; }
.potd .kind { font: 700 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.potd h3 { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
.potd .price { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.potd .price b { font: 700 26px/1 var(--mono); }
.potd p { margin: 0; font-size: 14px; color: var(--muted); }

/* tags */
.tag { display: inline-block; font: 700 11px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; border-radius: 6px;
  padding: 4px 6px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.tag.lock { background: var(--win-soft); color: var(--win); border-color: transparent; }
.tag.dog, .tag.early { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.tag.prop { background: var(--info-soft); color: var(--info); border-color: transparent; }
.tag.live, .tag.live_win, .tag.live_plus { background: var(--live-soft); color: var(--live); border-color: transparent; }
.tag.won { background: var(--win-soft); color: var(--win); border-color: transparent; }
.tag.lost { background: var(--loss-soft); color: var(--loss); border-color: transparent; }

/* game groups and pick rows */
.game { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; }
.game:first-child { border-top: 0; padding-top: 0; }
.game-head { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); font-weight: 600; flex-wrap: wrap; }
.game-head b { color: var(--fg); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 0; }
.row + .row { border-top: 1px dashed var(--line); }
.row .sel { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
.row .sel strong { font-size: 17px; overflow-wrap: anywhere; }
.row .odds { text-align: right; }
.row .odds b { font: 700 18px/1.2 var(--mono); display: block; }
.row .odds small { color: var(--muted); font-size: 13px; }
.row .why { grid-column: 1 / -1; font-size: 14px; color: var(--muted); margin: 0; }
.row .meta { grid-column: 1 / -1; display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.move-good { color: var(--win); font-weight: 600; } .move-bad { color: var(--muted); }
.live-dot { color: var(--live); font-weight: 700; }
.live-dot::before { content: "● "; }
.rank { font: 700 15px var(--mono); color: var(--accent); min-width: 1.6ch; }
details.more { grid-column: 1 / -1; }
details.more summary { cursor: pointer; color: var(--info); font-size: 14px; font-weight: 600; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: " ›"; }
details.more[open] summary::after { content: " ‹"; }
details.more ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; display: grid; gap: 3px; }
.add { background: none; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
.add[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* live slots */
.slot { border: 1px solid var(--line); border-left: 4px solid var(--live); border-radius: 12px; padding: 12px; background: var(--surface-2); display: grid; gap: 4px; }
.slot.plus { border-left-color: var(--accent); }
.slot .kind { font: 700 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* results */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.stat span { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat b { font: 700 20px/1.15 var(--mono); }
.stat small { font-size: 13px; color: var(--muted); }
.pos { color: var(--win) !important; } .neg { color: var(--loss) !important; }
.chart { width: 100%; height: 110px; display: block; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { padding: 8px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td { font-variant-numeric: tabular-nums; }
.model ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* docked parlay slip */
.slip { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface); border-top: 1px solid var(--line-2); box-shadow: 0 -6px 20px rgba(0, 0, 0, .35); }
.slip-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: grid; gap: 8px; }
.slip-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.slip-bar button { background: none; border: 0; cursor: pointer; font-weight: 700; padding: 4px 0; }
.slip-body { display: grid; gap: 8px; max-height: 45vh; overflow-y: auto; }
.slip-body ol { margin: 0; padding-left: 20px; font-size: 15px; }
.slip-body .stake { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.slip-body input { width: 90px; border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; background: var(--surface-2); color: var(--fg); font: 600 15px var(--mono); }
footer { color: var(--muted); font-size: 14px; display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 12px; }
</style>

<div class="photo-bg" aria-hidden="true" style="--mascot: url('__MASCOT__')"></div>
<main class="wrap">
  <header class="mast"><h1>Funky <span>Buttlovin</span></h1><p id="updated">Loading…</p></header>
  <div id="demo"></div>
  <section class="board" id="scoreboard" aria-label="Season record"></section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <div class="filters"><div class="seg" id="sports" aria-label="Sport"></div><div class="seg" id="markets" aria-label="Bet type"></div></div>
  <div id="view" class="grid"></div>
  <footer>
    <span>Free data: ESPN stats and DraftKings lines. Picks only; no bets are placed.</span>
    <span>No model wins every bet. Judge it by the record and the closing-line value over many picks. Bet only what you can afford to lose.</span>
  </footer>
</main>
<aside class="slip" id="slip" aria-label="Parlay slip" hidden></aside>

<script id="edge-data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  let DATA = JSON.parse(document.getElementById("edge-data").textContent);
  const slip = new Set();
  let slipOpen = false;
  const SOCCER = new Set(["epl", "laliga", "bundesliga", "seriea", "ligue1", "mls", "ucl"]);
  const SPORTS = [["all", "All"], ["nfl", "NFL"], ["nba", "NBA"], ["mlb", "MLB"], ["nhl", "NHL"], ["soccer", "Soccer"]];
  const MARKETS = [["all", "All bets"], ["spreads", "Spreads"], ["totals", "O/U"], ["props", "Props"], ["moneyline", "ML"]];
  const TABS = [["today", "Today"], ["live", "Live"], ["props", "Props"], ["early", "Early"], ["results", "Results"], ["model", "Model"]];
  const TIER = { lock: "Lock", dog: "Dog", prop: "Prop of the day", value: "Value", early: "Early", lean: "Lean",
    live: "Live", live_win: "Live · likely winner", live_plus: "Live · plus money" };
  const state = { tab: "today", sport: "all", market: "all" };
  try { Object.assign(state, JSON.parse(localStorage.getItem("fb-state") || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem("fb-state", JSON.stringify(state)); } catch (e) {} };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const odds = (a) => (a > 0 ? "+" : "") + Math.round(a);
  const dec = (a) => (a > 0 ? 1 + a / 100 : 1 + 100 / -a);
  const implied = (a) => 1 / dec(a);
  const toAmerican = (d) => (d >= 2 ? Math.round((d - 1) * 100) : Math.round(-100 / (d - 1)));
  const pct = (x, d = 0) => (x == null ? "–" : (x * 100).toFixed(d) + "%");
  const signed = (x, d = 1) => (x == null ? "–" : (x >= 0 ? "+" : "") + x.toFixed(d));
  const money = (x) => (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const tz = DATA.tz || undefined;
  const fmt = (iso, o) => new Date(iso).toLocaleString(undefined, Object.assign({ timeZone: tz }, o));
  const dayOf = (iso) => new Date(iso).toLocaleDateString("en-CA", { timeZone: tz });
  const groupOf = (e) => (e.player ? "props" : e.market === "spreads" ? "spreads" : e.market === "totals" ? "totals" : "moneyline");
  const sportGroup = (k) => (SOCCER.has(k) ? "soccer" : k);
  const isLive = (e) => (e.tier || "").startsWith("live");
  const isOpen = (e) => e.status === "pending" && new Date(e.commence_time) > new Date();
  const visible = (e) => (state.sport === "all" || sportGroup(e.sport) === state.sport) && (state.market === "all" || groupOf(e) === state.market);
  const today = () => dayOf(DATA.generated_at);
  const onBoard = (e) => visible(e) && (!e.settled || e.day === today());
  const cls = (x) => (x == null ? "" : x >= 0 ? "pos" : "neg");
  const rec = (s) => `${s.won}-${s.lost}${s.push ? "-" + s.push : ""}`;
  const units = (e) => (e.units > 0 ? `${e.units === 0.5 ? "½" : e.units}u` : "lean");
  const timeOf = (e) => fmt(e.commence_time, { weekday: "short", hour: "numeric", minute: "2-digit" });
  const SETTLED = { won: "Won", lost: "Lost", push: "Push", void: "Void", half_won: "Half won", half_lost: "Half lost" };

  function moveText(e) {
    if (e.current_odds == null || e.settled || isLive(e)) return "";
    const moved = e.current_point != null && e.point != null && e.current_point !== e.point;
    if (e.current_odds === e.odds && !moved) return `<span class="muted">Line steady at ${odds(e.odds)}</span>`;
    const now = moved ? `${e.current_point > 0 ? "+" : ""}${e.current_point} ${odds(e.current_odds)}` : odds(e.current_odds);
    const beat = implied(e.current_odds) > implied(e.odds) || (moved && e.market === "spreads" && e.current_point < e.point);
    return beat ? `<span class="move-good">Got ${odds(e.odds)}, now ${now}: beat the line</span>` : `<span class="move-bad">Got ${odds(e.odds)}, now ${now}</span>`;
  }
  function statusText(e) {
    if (SETTLED[e.status]) {
      const c = e.status.replace("half_", "");
      const p = e.units > 0 && e.profit != null ? ` ${signed(e.profit, 2)}u` : "";
      return `<span class="tag ${c}">${SETTLED[e.status]}</span> <span class="muted">${esc(e.final || "")}${e.result_value != null ? " · finished " + e.result_value : ""}${p}</span>`;
    }
    if (e.status === "live" && e.live) return `<span class="live-dot">${esc(e.away)} ${e.live.away ?? ""}, ${esc(e.home)} ${e.live.home ?? ""} · ${esc(e.live.detail || "")}</span>`;
    return "";
  }
  function addBtn(e) {
    if (!isOpen(e)) return "";
    return `<button class="add" data-add="${e.id}" aria-pressed="${slip.has(e.id)}">${slip.has(e.id) ? "In slip" : "+ Slip"}</button>`;
  }
  function row(e, opts = {}) {
    const more = e.reasons && e.reasons.length ? `<details class="more"><summary>Why</summary><ul>${e.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul></details>` : "";
    return `<div class="row">
      <div class="sel">${opts.rank ? `<span class="rank">${e.best_rank}</span>` : ""}<span class="tag ${e.tier}">${TIER[e.tier] || e.tier}</span><strong>${esc(e.selection.replace(" (live)", ""))}</strong></div>
      <div class="odds"><b>${odds(e.odds)}</b><small>${units(e)} · ${signed(e.ev * 100, 1)}% EV</small></div>
      <p class="why">${esc(e.headline)}</p>
      <div class="meta">${opts.matchup ? `<span class="muted">${esc(e.matchup)} · ${timeOf(e)}</span>` : ""}${moveText(e)}${statusText(e)}${addBtn(e)}</div>
      ${more}</div>`;
  }
  const empty = (msg) => `<p class="empty">${msg}</p>`;
  const panel = (title, aside, body) => `<section class="panel"><div class="panel-head"><h2>${title}</h2><span class="muted">${aside || ""}</span></div>${body}</section>`;

  function byGame(list) {
    const games = new Map();
    list.forEach((e) => { if (!games.has(e.event_id)) games.set(e.event_id, []); games.get(e.event_id).push(e); });
    return [...games.values()].sort((a, b) => new Date(a[0].commence_time) - new Date(b[0].commence_time)).map((g) => {
      const e = g[0];
      return `<div class="game"><div class="game-head"><span><b>${esc(e.matchup)}</b> · ${esc(e.sport_name)}</span><span>${timeOf(e)}</span></div>
        ${g.sort((a, b) => b.ev - a.ev).map((x) => row(x)).join("")}</div>`;
    }).join("");
  }

  function viewToday() {
    const items = DATA.entries.filter(onBoard);
    const potd = ["lock", "dog", "prop"].map((t) => {
      const e = items.find((x) => x.tier === t);
      const label = { lock: "Lock of the day", dog: "Dog of the day", prop: "Prop of the day" }[t];
      const photo = "";
      if (!e) return `<div class="potd${photo}"><span class="kind">${label}</span><p>Posts once a game clears the bar.</p></div>`;
      return `<div class="potd${photo}"><span class="kind">${label}</span><h3>${esc(e.selection)}</h3>
        <div class="price"><b>${odds(e.odds)}</b><span class="muted">${units(e)} · $100 wins $${(100 * (dec(e.odds) - 1)).toFixed(0)}</span></div>
        <p>${esc(e.matchup)} · ${timeOf(e)}</p><p>${esc(e.headline)}</p><div>${statusText(e)} ${moveText(e)}</div></div>`;
    }).join("");
    const best = items.filter((e) => e.best_rank).sort((a, b) => a.best_rank - b.best_rank);
    const rest = items.filter((e) => !isLive(e) && !["early", "lean"].includes(e.tier) && !e.player);
    const leans = items.filter((e) => e.tier === "lean");
    return panel("Picks of the day", fmt(DATA.generated_at, { weekday: "long", month: "long", day: "numeric" }), `<div class="grid three">${potd}</div>`)
      + panel("Best bets", "Top 5 by bankroll growth", best.length ? best.map((e) => row(e, { rank: true, matchup: true })).join("") : empty("Best bets post with the next scan."))
      + panel("The board", "Today's game-line plays, by game", rest.length ? byGame(rest) : empty("No game-line plays on today's board."))
      + panel("Leans", "No units, tracked anyway", leans.length ? byGame(leans) : empty("No leans right now."));
  }

  function viewLive() {
    const items = DATA.entries.filter((e) => isLive(e) && onBoard(e)).sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
    const latest = (t) => items.find((e) => e.tier === t);
    const slot = (t, title, extra) => { const e = latest(t);
      return `<div class="slot ${extra}"><span class="kind">${title}</span>${e ? row(e, { matchup: true }) : `<p class="empty">None yet in this session.</p>`}</div>`; };
    const shown = new Set([latest("live_win"), latest("live_plus")].filter(Boolean).map((e) => e.id));
    const earlier = items.filter((e) => !shown.has(e.id));
    const howto = `<ol class="steps"><li>Open the GitHub app on your phone.</li><li>Go to <b>tdrey10/sports → Actions → Live session</b>.</li><li>Tap <b>Run workflow</b>, pick sports and hours.</li></ol>
      <p class="empty">Each new live bet shows up here and as a notification on the “Funky Buttlovin live bets” issue.</p>`;
    return panel("Live right now", items.length ? `${items.length} live bets today` : "",
        `<div class="grid two">${slot("live_win", "Most likely to win · 60%+", "")}${slot("live_plus", "Live plus money", "plus")}</div>`)
      + (earlier.length ? panel("Earlier live bets", "", earlier.map((e) => row(e, { matchup: true })).join("")) : "")
      + panel("Start a live session", "Free · up to 5 hours", howto);
  }

  function viewList(filter, title, aside, msg) {
    const items = DATA.entries.filter((e) => onBoard(e) && filter(e)).sort((a, b) => b.ev - a.ev);
    return panel(title, aside, items.length ? items.map((e) => row(e, { matchup: true })).join("") : empty(msg));
  }

  function chart(curve, start) {
    if (!curve.length) return "";
    const pts = [start, ...curve.map((c) => c[1])];
    const lo = Math.min(...pts), hi = Math.max(...pts), W = 700, H = 110, pad = 8, span = hi - lo || 1;
    const x = (i) => pad + (i / (pts.length - 1)) * (W - 2 * pad), y = (v) => H - pad - ((v - lo) / span) * (H - 2 * pad);
    const d = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    const col = pts[pts.length - 1] >= start ? "var(--win)" : "var(--loss)";
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Bankroll over time">
      <line x1="0" x2="${W}" y1="${y(start)}" y2="${y(start)}" stroke="var(--line-2)" stroke-dasharray="4 4"/>
      <path d="${d}L${x(pts.length - 1)},${H}L${x(0)},${H}Z" fill="${col}" opacity=".12"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }
  function viewResults() {
    const st = DATA.stats;
    const tierRows = [["lock", "Lock of the day"], ["dog", "Dog of the day"], ["prop", "Prop of the day"], ["value", "Value plays"], ["early", "Early value"], ["live_win", "Live · likely winner"], ["live_plus", "Live · plus money"]]
      .map(([k, n]) => { const s = st.by_tier[k] || { won: 0, lost: 0, units: 0 }; return `<tr><td>${n}</td><td>${rec(s)}</td><td class="${cls(s.units)}">${signed(s.units, 1)}u</td><td>${s.roi == null ? "–" : signed(s.roi * 100, 0) + "%"}</td></tr>`; }).join("");
    const typeRows = [["spreads", "Spreads"], ["totals", "Over/Under"], ["props", "Props"], ["moneyline", "Moneyline"]]
      .map(([k, n]) => { const s = st.by_market[k]; return `<tr><td>${n}</td><td>${rec(s)}</td><td class="${cls(s.units)}">${signed(s.units, 1)}u</td><td class="${cls(s.clv)}">${s.clv == null ? "–" : signed(s.clv * 100, 1) + "%"}</td></tr>`; }).join("");
    const sportRows = Object.entries(st.by_sport).map(([k, s]) => `<tr><td>${esc(s.name)}</td><td>${rec(s)}</td><td>${pct(s.win_pct)}</td><td class="${cls(s.units)}">${signed(s.units, 1)}u</td></tr>`).join("");
    const recent = DATA.entries.filter((e) => e.settled && e.status !== "void" && visible(e)).sort((a, b) => (b.graded_at || "").localeCompare(a.graded_at || "")).slice(0, 15);
    return panel("Bankroll", `Started at ${money(st.start_bankroll)} · 1 unit = ${money(st.unit_value)}`,
        `<div class="stats"><div class="stat"><span>Bankroll</span><b class="${cls(st.bankroll - st.start_bankroll)}">${money(st.bankroll)}</b></div>
         <div class="stat"><span>Last 7 days</span><b class="${cls(st.last7.units)}">${signed(st.last7.units, 1)}u</b><small>${rec(st.last7)}</small></div>
         <div class="stat"><span>Leans</span><b>${st.leans.won}-${st.leans.lost}</b><small>no units</small></div></div>${chart(st.curve, st.start_bankroll)}`)
      + panel("By pick type", "", `<div class="table-wrap"><table><thead><tr><th>Pick</th><th>W-L</th><th>Units</th><th>ROI</th></tr></thead><tbody>${tierRows}</tbody></table></div>`)
      + panel("By bet type", "CLV: our price vs the closing line", `<div class="table-wrap"><table><thead><tr><th>Bet</th><th>W-L</th><th>Units</th><th>CLV</th></tr></thead><tbody>${typeRows}</tbody></table></div>`)
      + (sportRows ? panel("By sport", "", `<div class="table-wrap"><table><thead><tr><th>Sport</th><th>W-L</th><th>Win</th><th>Units</th></tr></thead><tbody>${sportRows}</tbody></table></div>`) : "")
      + panel("Latest graded", "", recent.length ? recent.map((e) => row(e, { matchup: true })).join("") : empty("Results appear after games finish."));
  }

  function viewModel() {
    const b = (DATA.brains || []).filter((x) => x.games);
    const all = b.reduce((a, x) => ({ g: a.g + x.games, w: a.w + x.accuracy * x.games }), { g: 0, w: 0 });
    const keys = (b.find((x) => x.sport === "nfl") || {}).key_numbers || [];
    const rows = b.map((x) => `<tr><td>${esc(x.name)}</td><td>${x.games}</td><td>${pct(x.accuracy, 1)}</td><td class="${x.log_loss <= x.baseline_log_loss ? "pos" : "neg"}">${signed((1 - x.log_loss / x.baseline_log_loss) * 100, 1)}%</td></tr>`).join("");
    const weights = Object.entries(DATA.weights || {}).map(([k, w]) => `${esc(k.replace(":", " "))} ${(100 - w * 100).toFixed(0)}% model`).join(" · ");
    return panel("How the model is doing", b[0] ? "Retrained " + fmt(b[0].trained_at, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "",
      `<div class="model"><ul>
        ${all.g ? `<li>Picks the straight-up winner <b>${pct(all.w / all.g, 0)}</b> of the time on ${all.g.toLocaleString()} recent games it never saw.</li>` : ""}
        ${keys.length ? `<li>Learned NFL key numbers from real scores: ${keys.map((k) => k[0]).join(", ")}.</li>` : ""}
        <li>Prices blend our numbers with the market's no-vig odds. ${weights ? "Learned trust: " + weights + "." : "Trust is re-learned once a sport has 60 graded picks."}</li>
        <li>Live picks need the model to agree with the market's direction; a "likely winner" needs 60%+ on our numbers.</li></ul></div>
       ${rows ? `<div class="table-wrap"><table><thead><tr><th>Sport</th><th>Games</th><th>Winner</th><th>vs coin flip</th></tr></thead><tbody>${rows}</tbody></table></div>` : ""}`);
  }

  function renderSlip() {
    const legs = DATA.entries.filter((e) => slip.has(e.id));
    $("slip").hidden = !legs.length;
    if (!legs.length) return;
    const d = legs.reduce((x, e) => x * dec(e.current_odds ?? e.odds), 1), p = legs.reduce((x, e) => x * e.win_prob, 1);
    const games = new Set(legs.map((e) => e.event_id));
    let stake = 10;
    try { stake = parseFloat($("stake")?.value) || 10; } catch (e) {}
    $("slip").innerHTML = `<div class="slip-in"><div class="slip-bar"><button id="slip-toggle" aria-expanded="${slipOpen}">Parlay · ${legs.length} leg${legs.length > 1 ? "s" : ""} · <span class="num">${odds(toAmerican(d))}</span> ${slipOpen ? "▾" : "▴"}</button>
      <span class="small"><span class="${cls(p * d - 1)}">${signed((p * d - 1) * 100, 1)}% EV</span> · hits ${pct(p, 1)}</span></div>
      ${slipOpen ? `<div class="slip-body"><ol>${legs.map((e) => `<li>${esc(e.selection)} <span class="num">${odds(e.current_odds ?? e.odds)}</span></li>`).join("")}</ol>
        ${games.size < legs.length ? `<p class="small neg" style="margin:0">Two legs from one game move together; most books won't take that parlay.</p>` : ""}
        <div class="stake"><label for="stake">Stake $</label><input id="stake" type="number" min="1" value="${stake}" inputmode="decimal"><span>pays <b class="num" id="pays">${money(stake * d)}</b></span>
        <button class="add" id="clear-slip">Clear</button></div></div>` : ""}</div>`;
  }

  function renderTop() {
    const st = DATA.stats, o = st.overall;
    $("updated").textContent = "Sports picks engine · updated " + fmt(DATA.generated_at, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    $("demo").innerHTML = DATA.demo ? `<div class="demo">Demo data: made-up teams and odds so you can see how it works. Nothing here is a real bet.</div>` : "";
    $("scoreboard").innerHTML = `<div><span>Record</span><b>${rec(o)}</b><small>${pct(o.win_pct)} unit plays</small></div>
      <div><span>Profit</span><b class="${cls(o.units)}">${signed(o.units, 1)}u</b><small>${o.roi == null ? "–" : signed(o.roi * 100, 1) + "% ROI"}</small></div>
      <div><span>Bankroll</span><b class="${cls(st.bankroll - st.start_bankroll)}">${money(st.bankroll)}</b><small>from ${money(st.start_bankroll)}</small></div>
      <div><span>Beat the close</span><b>${pct(o.beat_close)}</b><small>avg CLV ${o.clv == null ? "–" : signed(o.clv * 100, 1) + "%"}</small></div>`;
    const counts = { live: DATA.entries.filter((e) => isLive(e) && onBoard(e)).length, props: DATA.entries.filter((e) => e.player && onBoard(e)).length,
      early: DATA.entries.filter((e) => e.tier === "early" && onBoard(e)).length };
    $("tabs").innerHTML = TABS.map(([k, n]) => `<button role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${n}${counts[k] ? `<span class="count">${counts[k]}</span>` : ""}</button>`).join("");
    $("sports").innerHTML = SPORTS.map(([k, n]) => `<button data-sport="${k}" aria-pressed="${state.sport === k}">${n}</button>`).join("");
    $("markets").innerHTML = MARKETS.map(([k, n]) => `<button data-market="${k}" aria-pressed="${state.market === k}">${n}</button>`).join("");
  }

  function render() {
    renderTop();
    const views = {
      today: viewToday, live: viewLive, results: viewResults, model: viewModel,
      props: () => viewList((e) => e.player, "Player props", "Priced at -115 when ESPN shows no price", "No prop edges right now. NFL and NBA props are priced every morning."),
      early: () => viewList((e) => e.tier === "early", "Early value", "More than 24 hours out · bet before the line moves", "Nothing early yet."),
    };
    $("view").innerHTML = (views[state.tab] || viewToday)();
    renderSlip();
  }

  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.tab) { state.tab = t.dataset.tab; save(); render(); }
    else if (t.dataset.sport) { state.sport = t.dataset.sport; save(); render(); }
    else if (t.dataset.market) { state.market = t.dataset.market; save(); render(); }
    else if (t.dataset.add) { slip.has(t.dataset.add) ? slip.delete(t.dataset.add) : slip.add(t.dataset.add); if (slip.size === 1) slipOpen = true; render(); }
    else if (t.id === "slip-toggle") { slipOpen = !slipOpen; renderSlip(); }
    else if (t.id === "clear-slip") { slip.clear(); render(); }
  });
  document.addEventListener("input", (ev) => {
    if (ev.target.id !== "stake") return;
    const d = DATA.entries.filter((e) => slip.has(e.id)).reduce((x, e) => x * dec(e.current_odds ?? e.odds), 1);
    $("pays").textContent = money((parseFloat(ev.target.value) || 0) * d);
  });
  render();
  if (location.protocol.startsWith("http")) {
    setInterval(async () => { try { const r = await fetch("data.json", { cache: "no-store" }); if (r.ok) { DATA = await r.json(); render(); } } catch (e) {} }, 60000);
  }
})();
</script>
